name: momento
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  camera: ^0.12.1
  hand_landmarker: ^3.1.0
  get: ^4.7.3
  http: ^1.5.0
  http_parser: ^4.1.2
  image_picker: ^1.2.1
  video_player: ^2.14.0
  connectivity_plus: ^6.1.4
  flutter_secure_storage: ^9.2.2
  permission_handler: ^13.0.2
  crypto: ^3.0.3
  audioplayers: ^6.8.1
  google_sign_in: ^6.2.2
  share_plus: ^10.1.4
  socket_io_client: ^3.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/momento_logo.png"
