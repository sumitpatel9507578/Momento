    - assets/filters/Galaxy Background/
    - assets/filters/Hope/
    - assets/filters/Humanoid/
    - assets/filters/Makeup Look Simple/
    - assets/filters/Makeup Look w_ Slipt Screen Effect/
    - assets/filters/Ping Pong Minigame/
    - assets/filters/Pixel Heart Particles/
    - assets/filters/Snail/
    - assets/filters/Stallone/
    - assets/filters/Vendetta Mask/
    - assets/filters/Viking Helmet PBR/

flutter_launcher_icons:
